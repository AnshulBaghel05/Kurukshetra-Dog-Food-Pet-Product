<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C55F47" />
      <stop offset="100%" stop-color="#9C3E28" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.18" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Squircle Base Container in Brand Terracotta Brick -->
  <rect width="64" height="64" rx="16" fill="url(#terracottaGrad)" />

  <!-- Subtle inner border for crisp contrast in dark browser tabs -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#F6EFE4" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Dog Emblem & Paw Icon in Cream (#F6EFE4) & Amber (#E8A33D) -->
  <g filter="url(#softShadow)">
    <!-- Main Paw Pad / Dog Face Center (Clean stylized pet emblem) -->
    <path
      d="M32 29c-6.8 0-11.5 4.8-11.5 10.2 0 4.6 4.2 8.8 11.5 8.8s11.5-4.2 11.5-8.8C43.5 33.8 38.8 29 32 29z"
      fill="#F6EFE4"
    />

    <!-- Left Outer Toe / Ear -->
    <ellipse cx="19.5" cy="24.5" rx="4.2" ry="6.2" transform="rotate(-18 19.5 24.5)" fill="#F6EFE4" />

    <!-- Left Inner Toe / Ear -->
    <ellipse cx="27.5" cy="20.5" rx="4" ry="6.5" transform="rotate(-6 27.5 20.5)" fill="#F6EFE4" />

    <!-- Right Inner Toe / Ear -->
    <ellipse cx="36.5" cy="20.5" rx="4" ry="6.5" transform="rotate(6 36.5 20.5)" fill="#F6EFE4" />

    <!-- Right Outer Toe / Ear -->
    <ellipse cx="44.5" cy="24.5" rx="4.2" ry="6.2" transform="rotate(18 44.5 24.5)" fill="#F6EFE4" />

    <!-- Warm Amber Heart Emblem in the Center Pad -->
    <path
      d="M32 43.5l-.9-.8c-3.2-2.9-5.3-4.8-5.3-7.2 0-1.9 1.5-3.5 3.4-3.5 1.1 0 2.2.5 2.8 1.4.6-.9 1.7-1.4 2.8-1.4 1.9 0 3.4 1.6 3.4 3.5 0 2.4-2.1 4.3-5.3 7.2l-.9.8z"
      fill="#E8A33D"
    />
  </g>
</svg>
